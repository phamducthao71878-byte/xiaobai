<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小白AI｜人工智能趋势信息网</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--blue:#2457d6;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(125deg,#10234d,#2457d6);color:#fff;padding:30px 18px}
.wrap{max-width:1100px;margin:auto}h1{margin:0 0 8px;font-size:29px}header p{margin:0;line-height:1.7;color:#dbeafe}
main{max-width:1100px;margin:22px auto;padding:0 16px}.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px;color:var(--muted);font-size:14px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white;margin:0 0 14px}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;color:#334155}nav button.active{background:var(--blue);color:white;border-color:var(--blue)}
h2{font-size:21px;margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.tag{font-size:12px;color:var(--blue);font-weight:700}.card h3{font-size:17px;line-height:1.55;margin:8px 0}.card p{font-size:14px;line-height:1.8;color:#475569;overflow-wrap:anywhere}.card a{color:var(--blue);text-decoration:none;font-size:14px}.date{font-size:12px;color:var(--muted);margin-top:10px}
.summary{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;line-height:1.9;white-space:pre-wrap}.status{padding:12px;border-radius:9px;background:#fff7ed;color:#9a3412;font-size:14px;line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 12px}
@media(max-width:600px){h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap"><h1>小白AI</h1><p>人工智能趋势信息网｜追踪 AI 新消息、工具、教程、研究与应用<br>只展示有来源链接的内容；未核实的热度不会冒充“爆火”。</p></div></header>
<main>
<div class="meta"><span id="date">正在读取简报日期…</span><span id="count"></span></div>
<input id="search" placeholder="搜索标题、摘要、来源或关键词……">
<nav id="nav"></nav>
<div id="notice" class="status">正在加载最近 24 小时简报。首次部署后，请等待 GitHub Actions 完成更新。</div>
<section id="content"></section>
<h2>当日总结</h2><div id="summary" class="summary">等待数据更新……</div>
</main>
<footer>小白AI · 信息用于学习与选题参考，请点击原文核实。</footer>
<script>
const categories=["1. AI 新消息","2. 热门 AI 工具","3. 热门提示词","4. 大神热门教程","5. AI 赚钱案例","6. 热门 AI 视频","7. AI 论文与研究","8. AI 编程与开发","9. AI 政策与法规","10. AI 观点与争议","11. AI 垂直领域行业"];
let data={items:[],summary:"暂未生成总结。",generated_at:"",window:"最近24小时"}, selected="全部";
const nav=document.querySelector("#nav"), content=document.querySelector("#content"), search=document.querySelector("#search");
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
nav.innerHTML="";
["全部",...categories].forEach(c=>{let b=document.createElement("button");b.textContent=c;b.className=c===selected?"active":"";b.onclick=()=>{selected=c;render()};nav.appendChild(b)});
let q=search.value.trim().toLowerCase();
let arr=(data.items||[]).filter(x=>(selected==="全部"||x.category===selected)&&[x.title,x.summary,x.source,x.category].join(" ").toLowerCase().includes(q));
content.innerHTML="";
let cats=selected==="全部"?categories:[selected];
cats.forEach(cat=>{
let group=arr.filter(x=>x.category===cat);
let sec=document.createElement("section");let h=document.createElement("h2");h.textContent=cat+"（"+group.length+"）";sec.appendChild(h);
if(!group.length){let p=document.createElement("p");p.className="status";p.textContent="最近24小时内没有采集到足够且符合该分类的可靠内容。为避免编造，本栏目暂不补旧闻。";sec.appendChild(p)}
else{let grid=document.createElement("div");grid.className="grid";group.forEach(x=>{let card=document.createElement("article");card.className="card";card.innerHTML=`<div class="tag">${esc(x.category||"AI资讯")}</div><h3>${esc(x.title)}</h3><p>${esc(x.summary||"暂无摘要，请查看原文。")}</p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看原文 ↗</a><div class="date">${esc(x.source||"来源")} · ${esc(x.published_at||"发布时间未提供")}</div>`;grid.appendChild(card)});sec.appendChild(grid)}
content.appendChild(sec)
});
document.querySelector("#date").textContent="简报日期："+(data.date||"等待更新")+" · "+(data.window||"最近24小时");
document.querySelector("#count").textContent="已采集 "+(data.items||[]).length+" 条";
document.querySelector("#summary").textContent=data.summary||"暂无总结。";
document.querySelector("#notice").textContent=data.notice||"数据来自公开 RSS 与论文源；不同分类的数量取决于当天真实可核实的信息量。";
}
search.addEventListener("input",render);
fetch("./data.json?ts="+Date.now()).then(r=>{if(!r.ok)throw Error("data.json 尚未生成");return r.json()}).then(d=>{data=d;render()}).catch(e=>{document.querySelector("#notice").textContent="网页已发布，但还没有找到 data.json。请先运行仓库中的 GitHub Actions 工作流生成数据。";render()});
</script></body></html>
